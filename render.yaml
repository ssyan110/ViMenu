services:
  - type: web
    name: vimenu-guest-pwa
    runtime: node
    plan: free
    rootDir: apps/guest-pwa
    buildCommand: npm ci && npm run lint && npm run typecheck && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
